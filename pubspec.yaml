name: alter
description: ALTER, a voice-first AI Future Operating System.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  camera: ^0.11.4
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_lucide: ^1.11.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
